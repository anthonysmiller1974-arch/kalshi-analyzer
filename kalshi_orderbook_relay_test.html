<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalshi Order Book Relay Test</title><style>body{background:#0c1423;color:#e6f0ff;font:16px system-ui;margin:0;padding:16px;max-width:780px}input,button{box-sizing:border-box;font:inherit;padding:12px;margin:5px 0;border:1px solid #6685a7;border-radius:8px;background:#203954;color:white;width:100%}button{background:#236a7b}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1c2d;padding:12px;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #36516d;text-align:left}.hint{color:#b6c8dc}</style><h2>Order Book Relay Test (separate from V3.25)</h2><p class="hint">This is a connection diagnostic, not a trading signal. The relay must be deployed before its URL can work.</p><label>Kalshi market ticker<input id="ticker" value="KXBTC15M-26NOV201000-00"></label><label>Relay base URL (Cloudflare Worker URL, without /orderbook)<input id="relay" placeholder="https://your-worker.your-subdomain.workers.dev"></label><button id="direct">Test direct Kalshi API</button><button id="via">Test relay</button><button id="toggle">Start / stop 5-second refresh</button><p id="status">Ready</p><div id="metrics"></div><pre id="raw"></pre><script>
const $=id=>document.getElementById(id);let timer=null;const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ticker(){return $('ticker').value.trim().toUpperCase()}
async function load(relay=false){const t=ticker();if(!/^KXBTC15M-[A-Z0-9-]{4,80}$/.test(t)){ $('status').textContent='Invalid ticker';return}const base=$('relay').value.trim().replace(/\/$/,'');if(relay&&!/^https:\/\//.test(base)){ $('status').textContent='Enter the deployed Worker URL first';return}const url=relay?base+'/orderbook?ticker='+encodeURIComponent(t):'https://api.elections.kalshi.com/trade-api/v2/markets/'+encodeURIComponent(t)+'/orderbook?depth=10';$('status').textContent='Requesting '+(relay?'relay':'direct API')+'…';try{const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const d=await response.json();const book=d.orderbook_fp||d.orderbook;if(!book)throw Error('No orderbook in response');const parse=a=>(Array.isArray(a)?a:[]).map(([p,q])=>[Number(p),Number(q)]).filter(([p,q])=>Number.isFinite(p)&&Number.isFinite(q)).sort((a,b)=>b[0]-a[0]);const yes=parse(book.yes_dollars||book.yes),no=parse(book.no_dollars||book.no);const bid=yes[0]?.[0],ask=no[0]?1-no[0][0]:undefined;const sum=a=>a.slice(0,5).reduce((v,x)=>v+x[1],0),y=sum(yes),n=sum(no);const val=x=>x===undefined?'—':x.toFixed(4);$('metrics').innerHTML='<p>YES best bid: <b>'+val(bid)+'</b> | Implied ask: <b>'+val(ask)+'</b> | Spread: <b>'+val(bid===undefined||ask===undefined?undefined:ask-bid)+'</b></p><p>Top-5 YES size: '+y.toFixed(2)+' | NO size: '+n.toFixed(2)+' | Bid imbalance: '+(y+n?(100*(y-n)/(y+n)).toFixed(1)+'%':'—')+'</p><table><tr><th>YES bid</th><th>Contracts</th><th>NO bid</th><th>Contracts</th></tr>'+Array.from({length:5},(_,i)=>'<tr><td>'+val(yes[i]?.[0])+'</td><td>'+(yes[i]?.[1]??'—')+'</td><td>'+val(no[i]?.[0])+'</td><td>'+(no[i]?.[1]??'—')+'</td></tr>').join('')+'</table>';$('raw').textContent='Snapshot keys: '+Object.keys(d).join(', ');$('status').textContent='SUCCESS — '+new Date().toLocaleTimeString()+' via '+(relay?'relay':'direct API')}catch(e){$('status').textContent='FAILED — '+e.message+' (browser CORS or network may be responsible)';$('raw').textContent='';$('metrics').textContent=''}}
$('direct').onclick=()=>load(false);$('via').onclick=()=>load(true);$('toggle').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('toggle').textContent='Start / stop 5-second refresh'}else{load(true);timer=setInterval(()=>load(true),5000);$('toggle').textContent='Stop refresh'}};</script></html>
