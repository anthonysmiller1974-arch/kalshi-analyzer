name: Kalshi primary verification

on:
  push:
    branches: [kalshi-primary-rebuild, kalshi-primary-rebuild-clean]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check kalshi_primary.js
      - name: Probe public Kalshi market and candle APIs
        run: |
          node --input-type=module <<'NODE'
          const base = "https://external-api.kalshi.com/trade-api/v2";
          const get = async (url) => {
            const response = await fetch(url, { headers: { accept: "application/json" } });
            if (!response.ok) throw new Error(`HTTP ${response.status}: ${url}`);
            return response.json();
          };
          const now = Math.floor(Date.now() / 1000);
          const list = await get(`${base}/markets?series_ticker=KXBTC15M&status=settled&min_settled_ts=${now - 86400}&limit=5`);
          if (!Array.isArray(list.markets) || list.markets.length === 0) {
            throw new Error("Kalshi returned no recently settled KXBTC15M markets");
          }
          const market = list.markets[0];
          if (!market.ticker || !["yes", "no"].includes(String(market.result).toLowerCase())) {
            throw new Error("Settled market is missing ticker or official YES/NO result");
          }
          const detailData = await get(`${base}/markets/${encodeURIComponent(market.ticker)}`);
          const detail = detailData.market || detailData;
          if (detail.ticker !== market.ticker || !detail.status) {
            throw new Error("Single-market endpoint returned an unexpected market object");
          }
          const open = Math.floor(Date.parse(market.open_time) / 1000);
          const close = Math.ceil(Date.parse(market.close_time || market.latest_expiration_time) / 1000);
          if (!Number.isFinite(open) || !Number.isFinite(close) || close <= open) {
            throw new Error("Market open/close timestamps are not usable");
          }
          const candles = await get(`${base}/markets/candlesticks?market_tickers=${encodeURIComponent(market.ticker)}&start_ts=${open}&end_ts=${close}&period_interval=1`);
          if (!Array.isArray(candles.markets)) {
            throw new Error("Batch candlestick response is missing its markets array");
          }
          const candleMarket = candles.markets.find(x => x.market_ticker === market.ticker);
          if (!candleMarket || !Array.isArray(candleMarket.candlesticks)) {
            throw new Error("Batch candlestick response does not contain the requested market candles");
          }
          const usable = candleMarket.candlesticks.find(c =>
            Number.isFinite(Number(c.end_period_ts)) &&
            (c.yes_bid?.close_dollars != null || c.yes_bid?.close != null) &&
            (c.yes_ask?.close_dollars != null || c.yes_ask?.close != null)
          );
          if (!usable) throw new Error("Candles do not contain the YES bid/ask close fields expected by the analyzer");
          console.log(JSON.stringify({
            market: market.ticker,
            marketStatus: detail.status,
            result: market.result,
            candleCount: candleMarket.candlesticks.length,
            sampleCandleEnd: usable.end_period_ts,
            api: "public Kalshi market/detail/batch-candlestick"
          }, null, 2));
          NODE

      - name: Browser smoke test from the actual GitHub Pages origin
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          import { readFileSync } from "node:fs";
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            const pageErrors = [];
            const consoleErrors = [];
            const failedRequests = [];
            const apiResponses = [];
            page.on("pageerror", error => pageErrors.push(error.message));
            page.on("console", message => { if (message.type() === "error") consoleErrors.push(message.text()); });
            page.on("requestfailed", request => failedRequests.push({ url: request.url(), error: request.failure()?.errorText }));
            page.on("response", response => {
              if (response.url().includes("external-api.kalshi.com/trade-api/v2/markets?series_ticker=KXBTC15M")) {
                apiResponses.push({ status: response.status(), url: response.url() });
              }
            });
            await page.goto("https://anthonysmiller1974-arch.github.io/kalshi-analyzer/", { waitUntil: "domcontentloaded" });
            const html = readFileSync("index.html", "utf8");
            const js = readFileSync("kalshi_primary.js", "utf8");
            const combined = html.replace('<script src="kalshi_primary.js"></script>', '<script>' + js + '</script>');
            if (combined === html) throw new Error("Could not inline the test-branch JavaScript for origin testing");
            await page.setContent(combined, { waitUntil: "domcontentloaded" });
            await page.waitForFunction(() => {
              const s = document.querySelector("#kp-status")?.textContent || "";
              return s !== "" && s !== "Connecting…";
            }, null, { timeout: 20000 });
            await page.waitForTimeout(1500);
            const view = await page.evaluate(() => ({
              origin: location.origin,
              heading: document.querySelector("#kalshi-primary-app h1")?.textContent?.trim(),
              status: document.querySelector("#kp-status")?.textContent?.trim(),
              ticker: document.querySelector("#kp-ticker")?.textContent?.trim(),
              feed: document.querySelector("#kp-feed")?.textContent?.trim(),
              coinbase: document.querySelector("#kp-coinbase")?.textContent?.trim(),
              checkpoints: [10, 7, 5].map(n => !!document.querySelector("#kp-p" + n))
            }));
            if (view.origin !== "https://anthonysmiller1974-arch.github.io") throw new Error("Browser test did not retain the GitHub Pages origin: " + view.origin);
            if (view.heading !== "Kalshi 15-minute Analyzer") throw new Error("Primary analyzer UI did not render");
            if (!["Kalshi connected", "No open BTC 15m contract"].includes(view.status)) throw new Error("Kalshi browser connection failed: " + JSON.stringify({ view, apiResponses, consoleErrors, failedRequests, pageErrors }));
            if (!apiResponses.some(x => x.status === 200)) throw new Error("Browser did not receive a successful Kalshi market API response");
            if (view.checkpoints.some(x => !x)) throw new Error("One or more checkpoint panels are missing");
            if (pageErrors.length) throw new Error("Browser JavaScript errors: " + pageErrors.join(" | "));
            console.log(JSON.stringify({ browser: "Chromium", view, kalshiApi: apiResponses, consoleErrors, failedRequests, pageErrors }, null, 2));
          } finally {
            await browser.close();
          }
          NODE
