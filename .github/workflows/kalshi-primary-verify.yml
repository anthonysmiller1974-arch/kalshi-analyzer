name: Kalshi primary verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check kalshi_primary.js
      - name: Probe public Kalshi market and candle APIs
        run: |
          node --input-type=module <<'NODE'
          const base = "https://external-api.kalshi.com/trade-api/v2";
          const get = async (url) => {
            const response = await fetch(url, { headers: { accept: "application/json" } });
            if (!response.ok) throw new Error(`HTTP ${response.status}: ${url}`);
            return response.json();
          };
          const now = Math.floor(Date.now() / 1000);
          const list = await get(`${base}/markets?series_ticker=KXBTC15M&status=settled&min_settled_ts=${now - 86400}&limit=5`);
          if (!Array.isArray(list.markets) || list.markets.length === 0) throw new Error("No recently settled KXBTC15M markets");
          const market = list.markets[0];
          if (!market.ticker || !["yes", "no"].includes(String(market.result).toLowerCase())) throw new Error("Missing ticker or official YES/NO result");
          const detailData = await get(`${base}/markets/${encodeURIComponent(market.ticker)}`);
          const detail = detailData.market || detailData;
          if (detail.ticker !== market.ticker || !detail.status) throw new Error("Unexpected single-market response");
          const open = Math.floor(Date.parse(market.open_time) / 1000);
          const close = Math.ceil(Date.parse(market.close_time || market.latest_expiration_time) / 1000);
          if (!Number.isFinite(open) || !Number.isFinite(close) || close <= open) throw new Error("Invalid market timestamps");
          const candles = await get(`${base}/markets/candlesticks?market_tickers=${encodeURIComponent(market.ticker)}&start_ts=${open}&end_ts=${close}&period_interval=1`);
          if (!Array.isArray(candles.markets)) throw new Error("Batch candlestick response missing markets array");
          const item = candles.markets.find(x => x.market_ticker === market.ticker);
          if (!item || !Array.isArray(item.candlesticks)) throw new Error("Candlesticks missing requested market");
          const usable = item.candlesticks.find(c => Number.isFinite(Number(c.end_period_ts)) && c.yes_bid?.close_dollars != null && c.yes_ask?.close_dollars != null);
          if (!usable) throw new Error("No candle with YES bid/ask close_dollars fields");
          console.log(JSON.stringify({ market: market.ticker, status: detail.status, result: market.result, candles: item.candlesticks.length, sample: usable.end_period_ts }, null, 2));
          NODE
